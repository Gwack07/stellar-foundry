name: Java mod (stellar-core)

on:
  push:
    paths: ["mods-src/stellar-core/**", ".github/workflows/java-mod.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mods-src/stellar-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          if ! ./gradlew build --no-daemon > gradle.log 2>&1; then
            echo "::error title=Gradle build failed::$(grep -E "error:|FAILED|What went wrong|^>|Could not" gradle.log | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          tail -3 gradle.log
      - uses: actions/upload-artifact@v4
        with:
          name: stellar-core-jar
          path: mods-src/stellar-core/build/libs/*.jar
