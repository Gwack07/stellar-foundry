name: Java mod (stellar-core)

on:
  push:
    paths: ["mods-src/stellar-core/**", ".github/workflows/java-mod.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mods-src/stellar-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: stellar-core-jar
          path: mods-src/stellar-core/build/libs/*.jar
